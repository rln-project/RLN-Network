name: RLN Network Official Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify permanent signing key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$KEY_ALIAS" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD" || {
            echo 'Missing RLN release signing secrets'
            exit 1
          }

      - name: Build both Android variants
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: bash ./gradlew :app:assembleGmsRelease :app:assembleFossRelease --no-daemon --console=plain

      - name: Sign RLN with Google Cast
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/gms/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Sign RLN without Google Cast
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/foss/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Prepare signed release assets
        run: |
          mkdir -p release_files
          GMS=$(find app/build/outputs/apk/gms/release -type f -name '*-signed.apk' -print -quit)
          FOSS=$(find app/build/outputs/apk/foss/release -type f -name '*-signed.apk' -print -quit)
          test -n "$GMS" && test -n "$FOSS" || { echo 'Signed APK missing'; exit 1; }
          cp "$GMS" release_files/RLN-Network.apk
          cp "$FOSS" release_files/RLN-Network-no-cast.apk
          ls -lh release_files/*.apk

      - name: Publish official GitHub release for the in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -m1 -oP '^\s*versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          test -n "$VERSION" && test -n "$CODE" || { echo 'Missing version'; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists: increase versionName and versionCode first"
            exit 1
          fi
          printf 'RLN Network %s (versionCode %s)\n\nAggiornamento ufficiale per RLN Network.\n' "$VERSION" "$CODE" > release-notes.txt
          gh release create "v$VERSION" \
            release_files/RLN-Network.apk \
            release_files/RLN-Network-no-cast.apk \
            --title "RLN Network $VERSION" \
            --notes-file release-notes.txt \
            --latest
